<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Charli's Bunny Life</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bunny Life">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="apple-touch-icon" href="icon-180.png">

<style>html{-webkit-text-size-adjust:100%}body{margin:0;font-size:14px}[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap">
<style>
/* Layout: one full-screen room seen from the floor at child height. No chrome except two corner buttons; the bunny is the interface. Single committed look. */
:root{
  --ink:#4a3350; --paper:#fff7ef; --berry:#e8558a; --mint:#bfe6dc; --honey:#e9b77a; --sun:#ffd166; --line:#e6d3c4;
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif; --data:ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--mint);color:var(--ink);font-family:var(--display);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.corner{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);width:56px;height:56px;border-radius:50%;border:3px solid var(--paper);background:var(--berry);color:var(--paper);display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:0 4px 0 rgba(74,51,80,.25)}
.corner:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
#snd{right:16px}
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:16px;display:flex;gap:8px;align-items:center}
.hud .corner,#closeB{position:static}
.hud[hidden]{display:none}
.corner.pill{width:auto;border-radius:999px;padding:0 16px 0 10px;display:flex;gap:8px;font:700 1.5rem var(--display);background:var(--paper);color:var(--ink);border-color:var(--sun)}
.coin{display:inline-block;width:1.1em;height:1.1em;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe9a8,#f0a020);border:2px solid #d98a10;vertical-align:-.15em}
#sheet{position:fixed;inset:calc(env(safe-area-inset-top,0px) + 80px) 16px 16px;max-width:680px;margin:0 auto;background:var(--paper);border:4px solid var(--sun);border-radius:26px;padding:18px;overflow:auto;touch-action:pan-y;box-shadow:0 8px 0 rgba(74,51,80,.2)}
#sheet[hidden],#adopt[hidden]{display:none}
#closeB{float:right;margin:0 0 8px 8px}
#sheet h2,#adopt h2{font-size:1.7rem;margin:0 0 10px;line-height:1.1;text-wrap:balance}
#sheet h3{font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;margin:16px 0 6px;opacity:.7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px;clear:both}
.grid.big{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{font:700 1.3rem var(--display);color:var(--ink);background:#fff;border:3px solid var(--line);border-radius:18px;padding:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.card canvas{width:96px;height:96px}
.card.on{border-color:var(--berry);background:#fff0f5}
.card.no{animation:no .3s}
@keyframes no{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.card:focus-visible,.act:focus-visible,.dot:focus-visible,#adopt input:focus-visible{outline:4px solid var(--berry);outline-offset:2px}
.sub{margin:0;opacity:.75;font-size:1.05rem}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:12px 0 0;font-size:1.1rem}
dt{opacity:.7}dd{margin:0;font-weight:700}
#sheet ul{margin:0;padding-left:1.2em;font-size:1.05rem}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pillb{background:var(--sun);border-radius:999px;padding:2px 12px;font-weight:700}
.act{font:700 1.25rem var(--display);background:var(--berry);color:var(--paper);border:0;border-radius:999px;padding:10px 22px;cursor:pointer;margin-top:14px;box-shadow:0 4px 0 rgba(74,51,80,.25)}
#adopt{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 12px);max-width:600px;margin:0 auto;background:var(--paper);border:4px solid var(--sun);border-radius:26px;padding:12px 16px;display:flex;flex-direction:column;gap:8px;touch-action:manipulation;max-height:45%;overflow:auto}
.sw{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.swl{font-weight:700;font-size:1.1rem;min-width:4.6em}
.dot{width:36px;height:36px;border-radius:50%;border:3px solid var(--line);cursor:pointer;padding:0;font:700 1rem var(--display);color:var(--ink)}
.dot.on{border-color:var(--berry);box-shadow:0 0 0 3px var(--berry)}
#adopt input[type=color]{width:44px;height:44px;border:3px solid var(--line);border-radius:12px;padding:2px;background:#fff;cursor:pointer}
#adopt input[type=text]{font:700 1.3rem var(--display);color:var(--ink);border:3px solid var(--line);border-radius:14px;padding:6px 12px;min-width:0;flex:1 1 160px;background:#fff;-webkit-user-select:text;user-select:text}
#adopt .act{margin-top:0}
#grown{left:16px;width:36px;height:36px;background:rgba(255,247,239,.55);border-color:transparent;box-shadow:none;color:var(--ink)}
#camB{left:60px;width:44px;height:44px;background:var(--paper);color:var(--berry);border-color:var(--sun)}
@media (max-width:520px){#camB{left:12px;top:calc(env(safe-area-inset-top,0px) + 58px)}}
#moon{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);font:700 1.3rem var(--display);background:#3a3f78;color:#fff3c4;border:3px solid #fff3c4;border-radius:999px;padding:6px 22px;cursor:pointer}
#moon[hidden]{display:none}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.album img{width:100%;border-radius:12px;border:3px solid var(--line);cursor:pointer;display:block}
.album img.zoom{grid-column:1/-1}
#gate{font:700 1.3rem var(--display);color:var(--ink);border:3px solid var(--line);border-radius:14px;padding:6px 12px;width:6em;background:#fff;-webkit-user-select:text;user-select:text}
#gate:focus-visible{outline:4px solid var(--berry);outline-offset:2px}
#toast{max-width:calc(100% - 32px);white-space:normal;text-align:center;line-height:1.15;position:fixed;z-index:5;left:50%;top:calc(env(safe-area-inset-top,0px) + 84px);transform:translateX(-50%);background:var(--paper);border:4px solid var(--sun);border-radius:999px;padding:6px 22px;font-size:1.5rem;font-weight:700;box-shadow:0 5px 0 rgba(74,51,80,.2)}
#dbg{position:fixed;right:16px;top:calc(env(safe-area-inset-top,0px) + 80px);bottom:16px;width:min(340px,calc(100% - 32px));background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:14px;overflow:auto;font-size:.95rem;line-height:1.35;touch-action:pan-y;display:flex;flex-direction:column;gap:10px}
#dbg h2{font-size:1.05rem;margin:0}
#dbg h3{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;margin:0;opacity:.7}
#dbg pre{font-family:var(--data);font-size:.74rem;margin:0;white-space:pre-wrap;word-break:break-word}
#dbg .row{display:flex;flex-wrap:wrap;gap:6px}
#dbg button{font:inherit;font-size:.85rem;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:5px 9px;cursor:pointer}
#dbg button:focus-visible{outline:3px solid var(--berry)}
.bar{display:grid;grid-template-columns:78px 1fr;gap:8px;align-items:center;font-family:var(--data);font-size:.74rem}
.bar i{display:block;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i b{display:block;height:100%;background:var(--berry)}
#idle{font-weight:700}
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.stk{display:flex;flex-direction:column;align-items:center;font-size:.78rem;line-height:1.1;text-align:center;gap:2px}
.stk canvas{width:72px;height:72px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px;clear:both}
.tab{font:700 1.05rem var(--display);color:var(--ink);background:#fff;border:3px solid var(--line);border-radius:999px;padding:3px 14px;cursor:pointer}
.tab.on{background:var(--berry);border-color:var(--berry);color:var(--paper)}
.tab:focus-visible,.lv:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
.nm{font-size:.95rem;line-height:1.1;text-align:center}
.lvs{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;justify-content:center}
.lv{font:700 .9rem var(--display);color:var(--ink);border:0;border-radius:12px;padding:5px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.1;min-width:64px}
.lv small{font-size:.85rem;letter-spacing:.05em}
.lv.l0{background:#bfeedd}.lv.l1{background:#ffe39a}.lv.l2{background:#ffc0d3}
.lv.lock{background:var(--line);opacity:.65;cursor:default}.lv.lock small{font-size:.62rem;letter-spacing:0}
div.card{cursor:default}
.grid.big .card canvas{width:130px;height:130px}
.corner[hidden]{display:none}
.pv{display:block;width:min(240px,60%);height:auto;margin:0 auto 10px}
.who{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.who canvas{width:110px;height:110px}
#sheet h3.big{font-size:1.6rem;letter-spacing:0;text-transform:none;opacity:1;margin:0}
.wish{display:grid;grid-template-columns:minmax(0,1fr) 90px auto;gap:10px;align-items:center;font-size:1.05rem;margin-bottom:4px}
.wish i{display:block;height:12px;border-radius:6px;background:var(--line);overflow:hidden}.wish i b{display:block;height:100%;background:var(--berry)}
.rw{font-weight:700;white-space:nowrap}
@media (max-width:520px){.hud .corner{width:46px;height:46px}.hud{gap:5px}.corner.pill{font-size:1.2rem;padding:0 10px 0 6px;width:auto}}
#dbg[hidden],#toast[hidden]{display:none}
</style>
</head>
<body>
<canvas id="game" aria-label="Charli's bunny room"></canvas>
<button class="corner" id="snd" aria-label="Sound on or off"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9z"/><path id="sndw" d="M16 8.5a5 5 0 010 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg></button>
<button class="corner" id="grown" aria-label="Grown-ups"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2.4"/><circle cx="12" cy="12" r="2.4"/><circle cx="19" cy="12" r="2.4"/></svg></button>
<div id="toast" hidden></div>
<aside id="dbg" hidden>
  <h2>Grown-ups: bunny brain</h2>
  <div id="idle"></div>
  <h3>Needs</h3><div id="needs"></div>
  <h3>Personality</h3><div id="pers"></div>
  <h3>State</h3><pre id="state"></pre>
  <h3>Trigger</h3>
  <div class="row" id="trig"></div>
  <h3>Recent behaviour</h3><pre id="log"></pre>
  <h3>Memories</h3><pre id="mem"></pre>
</aside>
<script>
(()=>{
const cv=document.getElementById('game');let ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,rand=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const TAU=Math.PI*2;let reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=800,H=600,U=1,fT=280,DPR=1,time=0,speedMul=1;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=cv.clientWidth||innerWidth;H=cv.clientHeight||innerHeight;cv.width=W*DPR;cv.height=H*DPR;U=Math.sqrt(W*H)/900;fT=H*.47}
addEventListener('resize',resize);resize();
const proj=(x,d)=>({x:W/2+x*W*.5*(.6+.48*d),y:fT+(H-fT)*d,s:.55+.6*d});
const unproj=(sx,sy)=>{const d=clamp((sy-fT)/(H-fT),.08,.93);return{x:clamp((sx-W/2)/(W*.5*(.6+.48*d)),-.9,.9),d}};
const wdist=(a,b)=>Math.hypot(a.x-b.x,(a.d-b.d)*1.3);
const CHARLI={x:0,d:.8};

/* ---------- data: everything the bunny knows about is described here ---------- */
const FOODS={hay:{fill:.3,treat:false,col:'#d9c46a'},greens:{fill:.26,treat:false,col:'#6fbf5f'},carrot:{fill:.14,treat:true,col:'#ff9a3c'}};
const MILE={meal:'First meal',drink:'First drink',cuddle:'First cuddle',brush:'First brush',ball:'First ball game',box:'Found the box',nap:'First nap',zoom:'First zoomies',garden:'First garden visit',game:'First game',jump:'First jump',shop:'First shopping trip',carry:'First carry',hand:'Ate from your hand',tunnel:'Found the tunnel'};
const SAVE='charli-bunny-v1';
const RUN=()=>({face:1,view:'side',hopT:0,lift:0,anim:'idle',animT:0,steps:[],si:0,pause:1,beh:'arrive',recent:[],log:[],bubble:null,petRecent:0,brushRecent:0,inBox:null,hidden:false,carried:false,carT:0,carLim:6,look:0,fastT:0,cool:{},moving:0,stepT:0,sq:0,perch:0});
function mkBunny(col){return Object.assign({id:'b'+Date.now()+Math.floor(Math.random()*999),name:'',born:Date.now(),col:col||{fur:'#fffdf9',patch:'#f4cba1'},wear:{},size:rand(.93,1.05),x:rand(-.3,.3),d:.5,
  needs:{hunger:.42,thirst:.7,energy:.9,comfort:.7,social:.6,enrich:.55,hygiene:.75},pers:{cur:rand(.35,.75),play:rand(.35,.75),conf:rand(.35,.7),aff:rand(.35,.75),adv:rand(.35,.75)},
  taste:{hay:rand(.6,1),greens:rand(.5,1),carrot:rand(.7,1)},prefs:{food:{},toy:{},spot:{},act:{}},mem:[],treats:0,xp:0,stage:0},RUN())}
const KEEP=['id','name','born','col','wear','size','x','d','needs','pers','taste','prefs','mem','treats','xp','stage'];
function fresh(){return{v:2,born:Date.now(),bucks:20,set:{voice:true,calm:false,big:false,limit:0},play:{total:0,day:'',today:0},owned:[],bunnies:[],theme:{wallOn:{}},stars:{},quests:[],wishes:0,
  objs:[{id:'foodBowl',type:'bowl',x:-.42,d:.44,food:[]},{id:'waterBowl',type:'water',x:-.14,d:.36,water:.15},
        {id:'ball',type:'ball',x:.22,d:.62,vx:0,vd:0,rot:0},{id:'box',type:'box',x:.52,d:.26},{id:'bed',type:'bed',x:-.62,d:.2},
        {id:'crate',type:'crate',x:-.66,d:.84,fixed:true},{id:'jug',type:'jug',x:.7,d:.84,home:true},{id:'brush',type:'brush',x:.42,d:.86},{id:'tunnel',type:'tunnel',x:.28,d:.4}]}}
let G=fresh();
try{const s=JSON.parse(localStorage.getItem(SAVE)||'null');if(s&&s.objs){
  if(s.b){const o=s.b;o.col=s.look||{fur:'#fffdf9',patch:'#f4cba1'};o.wear=s.wear||{};if(o.wear.neck==='cape'){o.wear.back='cape';o.wear.neck=null}o.name=s.name||'';o.born=s.born;o.id='b0';o.size=1;s.bunnies=s.name?[o]:[];delete s.b;
    s.owned=(s.owned||[]).map(k=>k.startsWith('rug')?'rug:'+k.slice(3).toLowerCase():k)}
  G=Object.assign(fresh(),s);G.theme=G.theme||{};G.theme.wallOn=G.theme.wallOn||{};
  G.bunnies=(G.bunnies||[]).map(q=>{const z=Object.assign(mkBunny(),q,RUN());for(const k in z.needs)z.needs[k]=Math.max(z.needs[k],.5);z.treats=0;return z})}}catch(e){G=fresh()}
function save(){try{localStorage.setItem(SAVE,JSON.stringify({v:2,born:G.born,bucks:G.bucks,owned:G.owned,theme:G.theme,stars:G.stars,quests:G.quests,wishes:G.wishes,stickers:G.stickers,best:G.best,cnt:G.cnt,set:G.set,play:G.play,bunnies:G.bunnies.map(q=>{const z={};for(const k of KEEP)z[k]=q[k];return z}),objs:G.objs.filter(o=>o.type!=='food')}))}catch(e){}}
{const ens=(id,scn,o)=>{if(!G.objs.some(q=>q.id===id&&(q.scene||'home')===scn))G.objs.push(Object.assign({id,scene:scn},o))};
  ens('tunnel','home',{type:'tunnel',x:.28,d:.4});ens('ball','garden',{type:'ball',x:-.2,d:.6,vx:0,vd:0,rot:0});ens('tunnel','garden',{type:'tunnel',skin:'log',x:-.35,d:.34});ens('waterBowl','garden',{type:'water',x:.2,d:.2,water:1});ens('dig','garden',{type:'dig',x:.5,d:.55,fixed:true});ens('jump','garden',{type:'jump',x:.1,d:.5});ens('veg','garden',{type:'veg',x:-.5,d:.7,fixed:true,stage:0,wet:0,gt:0});ens('jug','garden',{type:'jug',x:.7,d:.84,home:true})}
let scene='home';const inScene=o=>(o.scene||'home')===scene;
let b=null,cur=G.bunnies[0]||null;b=cur;let O={};const reindex=()=>{O={};for(const o of G.objs)if(inScene(o))O[o.id]=o};reindex();
const idle={t:0,set:new Set()};
const parts=[],ripples=[];let hint=null,askT=0;

/* ---------- sound (starts on first touch) ---------- */
let AC=null,muted=false;try{muted=localStorage.getItem(SAVE+'-mute')==='1'}catch(e){}
function audioOn(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function tone(f0,f1,dur,vol,type){if(!AC||muted||simulating)return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=type||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.02)}
function noise(dur,vol,freq){if(!AC||muted||simulating)return;const n=AC.sampleRate*dur,buf=AC.createBuffer(1,n,AC.sampleRate),d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();f.type='bandpass';f.frequency.value=freq;g.gain.value=vol;s.buffer=buf;s.connect(f).connect(g).connect(AC.destination);s.start()}
const SND={hop:()=>tone(150,70,.09,.07),munch:()=>noise(.06,.16,1400),purr:()=>tone(95,80,.28,.05,'triangle'),pop:()=>tone(620,900,.07,.06),sip:()=>noise(.09,.08,3200),chime:()=>{tone(660,660,.18,.07);setTimeout(()=>tone(990,990,.3,.07),140)},thump:()=>tone(90,45,.14,.12),pour:()=>noise(.12,.06,2400)};

/* ---------- bunny brain ---------- */
const need=(k,a)=>{b.needs[k]=clamp(b.needs[k]+a,0,1)};
const bump=(group,key,a)=>{b.prefs[group][key]=(b.prefs[group][key]||0)+a;if(group==='act'){emit(key,a);grow(Math.min(a,1.5))}};
const fav=group=>{let best=null,v=0;for(const k in b.prefs[group])if(b.prefs[group][k]>v){v=b.prefs[group][k];best=k}return best};
const drift=(k,a)=>{b.pers[k]=clamp(b.pers[k]+a,.1,.95)};
function milestone(k){if(b.mem.some(m=>m.k===k))return;b.mem.push({k,t:Date.now()});G.bucks+=5;if(typeof hudUI==='function')hudUI();toast(MILE[k]);SND.chime();save()}
let toastT=0;const toastQ=[];function toast(t){if(simulating)return;if(toastT>.3&&$('toast').textContent!=='\u2605 '+t){if(toastQ.length<5&&!toastQ.includes(t))toastQ.push(t);return}$('toast').textContent='\u2605 '+t;$('toast').hidden=false;toastT=3.5;say(t)}
const happy=()=>{const n=b.needs;return(n.hunger+n.thirst+n.comfort+n.social+n.enrich)/5};
const randSpot=()=>({x:rand(-.8,.8),d:rand(.16,.8)});
const go=(t,speed,near)=>({go:t,speed:speed||.34,near:near||.05});
const an=(a,dur,tick,end)=>({an:a,dur,tick,end});
const call=f=>({call:f});
const bubble=(icon,t)=>{b.bubble={icon,t:t||3}};
function foodSources(){const out=[],ok=k=>!(FOODS[k].treat&&b.treats>=2);if(O.foodBowl&&O.foodBowl.food.some(ok))out.push(O.foodBowl);for(const o of G.objs)if(o.type==='food'&&inScene(o)&&!o.eaten&&ok(o.kind))out.push(o);return out}
function eatFrom(src){let kind;if(src.type==='bowl'){const i=src.food.findIndex(k=>!(FOODS[k].treat&&b.treats>=2));if(i<0)return;kind=src.food.splice(i,1)[0]}else{kind=src.kind;G.objs.splice(G.objs.indexOf(src),1)}
